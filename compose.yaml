name: cfdns

services:
  app:
    image: ${CFDNS_IMAGE:-ghcr.io/pi11/cfdns:latest}
    build: .
    restart: unless-stopped
    env_file: ${CFDNS_ENV_FILE:-.docker.env}
    ports:
      - "${CFDNS_PORT:-8000}:8000"
    volumes:
      - cfdns-data:/opt/cfdns/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  cfdns-data:
